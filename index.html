<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CRUD de Libros
  </title>

  <link
    rel="stylesheet"
    href="css/styles.css"
  >

</head>

<body>

  <main class="container">

    <header class="header">

      <h1>
        CRUD de Libros
      </h1>

      <p>
        Sistema de gestión de libros
      </p>

    </header>

    <section class="form-section">

      <h2>
        Agregar libro
      </h2>

      <form id="book-form">

        <div class="form-grid">

          <div class="form-group">

            <label for="title">
              Título
            </label>

            <input
              type="text"
              id="title"
              placeholder="Ingrese el título"
            >

          </div>

          <div class="form-group">

            <label for="author">
              Autor
            </label>

            <input
              type="text"
              id="author"
              placeholder="Ingrese el autor"
            >

          </div>

          <div class="form-group">

            <label for="year">
              Año
            </label>

            <input
              type="number"
              id="year"
              placeholder="Ingrese el año"
            >

          </div>

          <div class="form-group">

            <label for="genre">
              Género
            </label>

            <input
              type="text"
              id="genre"
              placeholder="Ingrese el género"
            >

          </div>

        </div>

        <div class="form-actions">

          <button
            type="submit"
            class="btn btn-primary"
          >

            Guardar libro

          </button>

        </div>

        <p
          id="form-message"
          class="form-message"
        ></p>

      </form>

    </section>

    <section class="list-section">

      <h2>
        Lista de libros
      </h2>

      <div class="table-container">

        <table id="books-table">

          <thead>

            <tr>

              <th>Título</th>

              <th>Autor</th>

              <th>Año</th>

              <th>Género</th>

              <th>Acciones</th>

            </tr>

          </thead>

          <tbody id="books-body"></tbody>

        </table>

        <p
          id="empty-message"
          class="empty-message"
        >

          No hay libros registrados.

        </p>

      </div>

    </section>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/books.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
